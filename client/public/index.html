<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TDBR — Top Down Battle Royale</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050510; }
    /* Radial vignette for LOS feel */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      background: radial-gradient(circle at 50% 50%,
        transparent 30%,
        rgba(0,0,0,0.15) 50%,
        rgba(0,0,0,0.45) 70%,
        rgba(0,0,0,0.75) 90%,
        rgba(0,0,0,0.92) 100%
      );
    }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/phaser@v4.0.0-rc.6/dist/phaser.min.js"></script>
  <script src="bundle.js"></script>
</body>
</html>
